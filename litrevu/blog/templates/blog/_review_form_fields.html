{{ review_form.non_field_errors }}

<div>
    {{ review_form.headline.label_tag }}<br>
    {{ review_form.headline }}
    {{ review_form.headline.errors }}
</div>
<div>
    {{ review_form.body.label_tag }}<br>
    {{ review_form.body }}
    {{ review_form.body.errors }}
</div>
<div class="rating-input">
    <span id="rating-label">Note</span>
    <div class="stars-input" role="group" aria-labelledby="rating-label">
        {% for value in "54321" %}
            <input type="radio"
                   id="star{{ value }}"
                   name="rating"
                   value="{{ value }}"
                   aria-label="{{ value }} étoile{% if value != '1' %}s{% endif %}"
                   {% if review_form.instance.rating|stringformat:"s" == value %}checked{% endif %}>
            <label for="star{{ value }}">★</label>
        {% endfor %}
    </div>
    {{ review_form.rating.errors }}
</div>
