{% extends 'base.html' %}

{% block content %}
<h1>Créer une critique en réponse</h1>

<p>Vous êtes en train de poster en réponse à :</p>
<div>
    <strong>{{ ticket.title }}</strong><br>
    {{ ticket.description }}<br>
    <em>Ticket créé le {{ ticket.time_created }}</em>
</div>

<form method="post">
    {% csrf_token %}
    {{ review_form.as_p }}
    <button type="submit">Envoyer</button>
</form>
{% endblock content %}
